<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Dossiê interativo do Projeto Livre Power BI — Tema 3 Gestão de Projetos (dados fictícios)."><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Dossiê Gestão de Projetos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral de vidro + painel de leitura sobre fundo animado em rede; estilo do dashboard do Currículo (teal → índigo → rosa) */
:root{
  --bg:#070b16; --bg2:#0c1324; --panel:rgba(18,27,48,.72); --panel-solid:#121b30; --panel2:rgba(28,40,68,.6); --ink:#e8eefc; --ink2:#b4c0dc; --ink3:#93a1c2;
  --line:rgba(148,170,220,.16); --accent:#36e2c4; --accent-ink:#04121a; --accent-soft:rgba(54,226,196,.14); --steel:#6f7dff; --steel-soft:rgba(111,125,255,.16); --pink:#ff7ab6;
  --good:#3ddc97; --warn:#ffc65c; --bad:#ff6b7d; --good-soft:rgba(61,220,151,.14); --warn-soft:rgba(255,198,92,.14); --bad-soft:rgba(255,107,125,.15);
  --code:rgba(8,13,26,.75); --shadow:0 20px 60px rgba(0,0,0,.45); --grad:linear-gradient(120deg,var(--accent),var(--steel) 55%,var(--pink));
  --f-display:"Space Grotesk",Inter,system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:18px; --glow:rgba(54,226,196,.10); --net:54,226,196; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6fc; --bg2:#e8eef9; --panel:rgba(255,255,255,.82); --panel-solid:#ffffff; --panel2:rgba(232,238,249,.8); --ink:#111a2e; --ink2:#3d4a66; --ink3:#5a6784;
  --line:rgba(40,60,110,.14); --accent:#0aa88c; --accent-ink:#ffffff; --accent-soft:rgba(10,168,140,.12); --steel:#4552e6; --steel-soft:rgba(69,82,230,.12); --pink:#d6407f;
  --good:#12935e; --warn:#b7791f; --bad:#d13b4f; --good-soft:rgba(18,147,94,.12); --warn-soft:rgba(183,121,31,.13); --bad-soft:rgba(209,59,79,.12);
  --code:rgba(232,238,249,.9); --shadow:0 18px 50px rgba(30,50,100,.14); --glow:rgba(69,82,230,.07); --net:69,82,230; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f6fc; --bg2:#e8eef9; --panel:rgba(255,255,255,.82); --panel-solid:#ffffff; --panel2:rgba(232,238,249,.8); --ink:#111a2e; --ink2:#3d4a66; --ink3:#5a6784;
  --line:rgba(40,60,110,.14); --accent:#0aa88c; --accent-ink:#ffffff; --accent-soft:rgba(10,168,140,.12); --steel:#4552e6; --steel-soft:rgba(69,82,230,.12); --pink:#d6407f;
  --good:#12935e; --warn:#b7791f; --bad:#d13b4f; --good-soft:rgba(18,147,94,.12); --warn-soft:rgba(183,121,31,.13); --bad-soft:rgba(209,59,79,.12);
  --code:rgba(232,238,249,.9); --shadow:0 18px 50px rgba(30,50,100,.14); --glow:rgba(69,82,230,.07); --net:69,82,230; color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:15px/1.6 var(--f-body);overflow-x:hidden;
  background:radial-gradient(1200px 700px at 85% -10%,rgba(111,125,255,.18),transparent 60%),radial-gradient(900px 600px at -10% 30%,rgba(54,226,196,.12),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;opacity:.7;pointer-events:none}
.cursor-glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,var(--glow),transparent 65%);transform:translate(-50%,-50%);left:-500px;top:-500px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);
  padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 24px rgba(54,226,196,.3)}
.brand-mark svg{width:20px;height:20px}
.brand b{font:700 16px/1.15 var(--f-display);display:block;letter-spacing:-.01em}
.brand small{font:500 10.5px/1.2 var(--f-mono);color:var(--ink3);letter-spacing:.6px;text-transform:uppercase}
.grp{font:600 10.5px/1 var(--f-mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);opacity:.85;padding:16px 10px 7px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:8px 10px;font-size:13.5px;color:var(--ink2);cursor:pointer;transition:background .2s,color .2s,transform .2s}
.nav button .ic{width:17px;height:17px;flex:none;color:var(--ink3);transition:color .2s,transform .3s}
.nav button:hover{background:var(--panel2);color:var(--ink);transform:translateX(3px)}
.nav button:hover .ic{color:var(--accent)}
.nav button[aria-current="true"]{background:linear-gradient(120deg,var(--accent-soft),var(--steel-soft));color:var(--ink);font-weight:600}
.nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad)}
.nav button[aria-current="true"] .ic{color:var(--accent)}
.nav button.ai{border:1px solid transparent;background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,var(--grad) border-box;color:var(--ink);margin-top:4px;font-weight:600}
/* main */
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding:0 12px}
.topline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.crumb{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.tag{font:500 11.5px/1 var(--f-mono);color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--panel);backdrop-filter:blur(10px)}
.topright{display:flex;gap:8px;align-items:center}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--ink);transition:transform .2s,border-color .2s}
.icon-btn:hover{transform:translateY(-2px) rotate(-8deg);border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
#view{animation:viewIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
h1{font:700 clamp(30px,4.4vw,48px)/1.05 var(--f-display);letter-spacing:-.025em;margin:.15em 0 .35em;text-wrap:balance;
  background:linear-gradient(120deg,var(--ink) 30%,var(--accent) 65%,var(--steel));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:hue 9s ease-in-out infinite alternate}
@keyframes hue{to{background-position:100% 0}}
h2{font:700 clamp(20px,2.4vw,25px)/1.2 var(--f-display);letter-spacing:-.02em;margin:34px 0 14px;text-wrap:balance;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--grad);flex:none}
h3{font:600 16px/1.3 var(--f-display);margin:0 0 6px;letter-spacing:-.01em}
.lede{color:var(--ink3);font-size:16.5px;max-width:74ch;margin:0 0 20px}
p{max-width:76ch}
.muted{color:var(--ink3)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.k3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.k3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.k3{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;transition:border-color .3s,box-shadow .3s,transform .3s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:var(--shadow)}
.card.flat{background:var(--panel2)}
.card.hl{background:linear-gradient(135deg,rgba(111,125,255,.16),rgba(54,226,196,.08) 60%,transparent),var(--panel)}
.card.hl::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.kpi{display:flex;flex-direction:column;gap:5px;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);transform-origin:left;animation:barIn 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes barIn{from{transform:scaleX(0)}}
.kpi .lab{font:500 12px/1.3 var(--f-body);color:var(--ink3)}
.kpi .val{font:700 clamp(28px,3vw,36px)/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .note{font-size:12.5px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-mono);padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--steel-soft);color:var(--steel)}
.tbl-wrap{overflow-x:auto;width:fit-content;max-width:100%;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(12px)}
table{border-collapse:collapse;width:auto;font-size:13.5px}
th,td{text-align:left;padding:4px 1ch;line-height:1.35;border-bottom:1px solid var(--line);vertical-align:middle}
td{max-width:62ch}
th{font:600 11px/1.3 var(--f-mono);letter-spacing:.6px;text-transform:uppercase;color:var(--accent);background:var(--panel2);position:sticky;top:0;white-space:nowrap}
tbody tr{transition:background .2s}tbody tr:hover{background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td.num{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:13px 15px;overflow-x:auto;font:12.5px/1.6 var(--f-mono);margin:8px 0 0;white-space:pre;color:var(--ink)}
ul.clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.ticks li{padding-left:24px;position:relative}
ul.ticks li::before{content:"";position:absolute;left:2px;top:6px;width:12px;height:7px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);transition:transform .2s,box-shadow .2s,border-color .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--grad);border:0;color:#04121a;box-shadow:0 10px 30px rgba(54,226,196,.25)}
.btn.primary:hover{box-shadow:0 14px 36px rgba(54,226,196,.35)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn .ic{width:16px;height:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 13px;font-size:13px;cursor:pointer;border-radius:999px;color:var(--ink2);transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#04121a;font-weight:600}
/* hero (início) */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(22px,4vw,42px);margin:6px 0 20px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(135deg,rgba(111,125,255,.18),rgba(54,226,196,.08) 60%,transparent),var(--panel);backdrop-filter:blur(12px)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);transform:translateX(-100%);animation:sheen 7s ease-in-out infinite 1.5s}
@keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hero .eyebrow{margin:0 0 6px;color:var(--accent);font:600 12.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.hero .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(54,226,196,.6)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(32px,5.4vw,60px);max-width:16ch;background:var(--grad);-webkit-background-clip:text;background-clip:text;background-size:200% 100%}
.hero .lede{color:var(--ink2);margin-bottom:22px}
.hero-mark{position:absolute;right:clamp(10px,4vw,48px);top:50%;width:clamp(120px,16vw,200px);height:auto;transform:translateY(-50%);opacity:.9;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(0,0,0,.35));pointer-events:none}
@keyframes float{50%{transform:translateY(calc(-50% - 14px))}}
@media (max-width:900px){.hero-mark{display:none}}
/* tiles */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));perspective:1200px}
.tile{--hue:var(--accent);position:relative;overflow:hidden;text-align:left;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:132px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:tileIn .6s cubic-bezier(.2,.8,.2,1) both}
.tile:nth-child(3n+2){--hue:var(--steel)} .tile:nth-child(3n){--hue:var(--pink)}
@keyframes tileIn{from{opacity:0;transform:translateY(22px)}}
.tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);opacity:0;transition:opacity .3s;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tile::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;left:var(--mx,50%);top:var(--my,50%);transform:translate(-50%,-50%);background:radial-gradient(circle,color-mix(in srgb,var(--hue) 26%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.tile:hover{box-shadow:var(--shadow)}
.tile:hover::before,.tile:hover::after,.tile:focus-visible::before{opacity:1}
.tile .ic{width:42px;height:42px;padding:10px;border-radius:13px;color:var(--hue);background:color-mix(in srgb,var(--hue) 14%,transparent);transition:transform .4s cubic-bezier(.2,.9,.2,1.4);box-sizing:border-box}
.tile:hover .ic{transform:rotate(-8deg) scale(1.12)}
.tile b{font:600 15.5px/1.3 var(--f-display);position:relative}
.tile span{font-size:12.5px;color:var(--ink3);line-height:1.45;position:relative}
/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--panel2);border-radius:99px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--steel),color-mix(in srgb,var(--steel) 60%,var(--accent)));border-radius:99px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.bar .fill.hot{background:var(--grad)}
@keyframes grow{from{width:0!important}}
.bar .v{text-align:right;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
svg text{font-family:var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* model */
.model-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.model-svg{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.model-svg svg{display:block;min-width:900px;width:100%;height:auto}
.mt{cursor:pointer;transition:opacity .3s}
.mt rect.box{fill:var(--panel-solid);stroke:var(--line);stroke-width:1.2}
.mt.fact rect.head{fill:var(--accent)} .mt.dim rect.head{fill:var(--steel)} .mt.meas rect.head{fill:var(--pink)}
.mt text.t{font:700 15px var(--f-display);fill:#fff}
.mt.fact text.t,.mt.fact text.hd{fill:#04121a}
.mt text.c{font-size:13px;fill:var(--ink2)}
.mt text.k{fill:var(--steel);font-weight:600}
.mt.sel rect.box{stroke:var(--accent);stroke-width:2.6}
.mt.dimmed{opacity:.25}
.rel{fill:none;stroke:var(--ink3);stroke-width:1.6;transition:opacity .3s,stroke .3s}
.rel.inactive{stroke:var(--pink);stroke-dasharray:6 5}
.rel.on{stroke:var(--accent);stroke-width:2.8}
.rel.dimmed{opacity:.12}
.flow .rel:not(.inactive){stroke-dasharray:4 7;animation:flow 1.1s linear infinite;stroke:var(--accent)}
@keyframes flow{to{stroke-dashoffset:-22}}
.relmark{font:700 15px var(--f-mono)}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:min(760px,100%);padding:12px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.6;animation:viewIn .4s ease both}
.msg.user{align-self:flex-end;background:linear-gradient(120deg,var(--accent-soft),var(--steel-soft));border:1px solid var(--line);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--panel-solid);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:11px 13px;resize:vertical;min-height:46px;transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--ink2);transition:border-color .2s,color .2s,transform .2s}
.chip:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-2px)}
/* timeline */
.tl{display:flex;height:38px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.tl div{display:flex;align-items:center;justify-content:center;font:600 11.5px var(--f-mono);color:#04121a;white-space:nowrap;overflow:hidden;padding:0 4px;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);transition:border-color .2s}
.check:hover{border-color:var(--accent)}
.check input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:none}
.check label{cursor:pointer}

function bars(rows, {fmt = v => sp(v), max, hot = 1, key = 'v'} = {}){
  const mx = max ?? Math.max(...rows.map(r => Math.abs(r[key])));
  return `<div class="bars">${rows.map((r, i) => `<div class="bar"><span>${esc(r.name)}</span>

}
function lineChart(series, {w = 560, h = 250, yFmt = v => pc(v, 0), labels, max} = {}){
  const L = 48, R = 14, Tp = 14, B = 30, n = labels.length;
  const mx = max ?? Math.max(...series.flatMap(s => s.data));
  const x = i => L + i * (w - L - R) / (n - 1), y = v => Tp + (1 - v / mx) * (h - Tp - B);
  const ticks = [0, .25, .5, .75, 1].map(t => t * mx);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de linhas">`;
  s += ticks.map(t => `<line x1="${L}" x2="${w - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink3)">${yFmt(t)}</text>`).join('');
  labels.forEach((l, i) => { if (i % 4 === 0 || i === n - 1 && i % 4 > 1) s += `<text x="${x(i)}" y="${h - 10}" text-anchor="middle" font-size="11" fill="var(--ink3)">${l}</text>` });
  series.forEach(se => {
    const pts = se.data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    if (se.area) s += `<polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="${se.color}" opacity=".12"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const lv = se.data[n - 1]; s += `<circle cx="${x(n - 1)}" cy="${y(lv)}" r="4" fill="${se.color}"/>`;
  });
  return s + '</svg>';
}
function comboChart(rows, {w = 560, h = 250} = {}){
  const L = 48, R = 14, Tp = 14, B = 30, n = rows.length;
  const mx = Math.max(...rows.flatMap(r => [r.orc, r.real])) * 1.08;
  const bw = (w - L - R) / n, y = v => Tp + (1 - v / mx) * (h - Tp - B);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Orçamento vs custo real por mês">`;
  [0, .25, .5, .75, 1].forEach(t => { const v = t * mx; s += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink3)">${(v / 1e6).toFixed(0)} M€</text>` });
  rows.forEach((r, i) => { const x0 = L + i * bw + bw * .18; s += `<rect x="${x0}" y="${y(r.real)}" width="${bw * .64}" height="${y(0) - y(r.real)}" rx="2" fill="var(--accent)" opacity=".9"><title>${r.m}: real ${meur(r.real)} · orçamento ${meur(r.orc)}</title></rect>`;
    if (i % 4 === 0 || i === n - 1 && i % 4 > 1) s += `<text x="${L + i * bw + bw / 2}" y="${h - 10}" text-anchor="middle" font-size="11" fill="var(--ink3)">${r.m}</text>` });
  s += `<polyline points="${rows.map((r, i) => `${L + i * bw + bw / 2},${y(r.orc)}`).join(' ')}" fill="none" stroke="var(--steel)" stroke-width="2.5"/>`;
  return s + '</svg>';
}
function donut(obj){
  const tot = Object.values(obj).reduce((a, b) => a + b, 0), cols = {'Concluída':'var(--good)','Em curso':'var(--steel)','Por iniciar':'var(--ink3)','Bloqueada':'var(--bad)'};
  let a = 0, s = '<svg viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="Tarefas por estado">';
  for (const [k, v] of Object.entries(obj)) { const a1 = a + v / tot * Math.PI * 2, lg = a1 - a > Math.PI ? 1 : 0;
    s += `<path d="M${60 + 50 * Math.sin(a)} ${60 - 50 * Math.cos(a)} A50 50 0 ${lg} 1 ${60 + 50 * Math.sin(a1)} ${60 - 50 * Math.cos(a1)}" stroke="${cols[k]}" stroke-width="18" fill="none"/>`; a = a1 }
  s += `<text x="60" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${tot}</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="var(--ink3)">tarefas</text></svg>`;
  return `<div class="row" style="gap:18px">${s}<div class="legend" style="flex-direction:column;gap:6px">${Object.entries(obj).map(([k, v]) => `<span><i style="background:${cols[k]}"></i>${k}: <b>${v}</b> (${pc(v / tot, 0)})</span>`).join('')}</div></div>`;
}

const MB = { // posição das caixas no diagrama
  dProjetos:[340,20], dCalendario:[930,20], fOrcamento:[20,330], fCustos:[350,330], fTarefas:[680,330], fProgresso:[1010,330],

const BOXW = 250;
function modelSvg(){
  const show = n => n === '_Medidas' ? ['42 medidas DAX'] : (M.tables[n]?.cols || []).filter((c, i) => !(M.tables[n].hidden || [])[i] || /^ID_|^Data/.test(c)).slice(0, 9);
  const hgt = n => 38 + 19 * show(n).length + 8;
  const anchor = (n, side) => { const [x, y] = MB[n], h = hgt(n); return side === 't' ? [x + BOXW / 2, y] : side === 'b' ? [x + BOXW / 2, y + h] : side === 'l' ? [x, y + h / 2] : [x + BOXW, y + h / 2] };
  let rels = '';
  M.rels.forEach((r, i) => { const [f, fc, t, tc, act] = r; const inactive = act === false;
    const fy = MB[f][1], ty = MB[t][1];
    let p, q; if (ty < fy) { p = anchor(f, 't'); q = anchor(t, 'b') } else { p = anchor(f, 'b'); q = anchor(t, 't') }
    const off = (['fOrcamento', 'fCustos', 'fTarefas', 'fProgresso'].indexOf(f) - 1.5) * 22;
    p = [p[0] + off * .6, p[1]]; q = [q[0] + off, q[1]];
    if (inactive) { p = anchor(f, 'r'); p = [p[0], p[1] + 10]; q = anchor(t, 'b'); q = [q[0] + 60, q[1]] }
    const my = (p[1] + q[1]) / 2 + (t === 'dCalendario' ? 14 : t === 'dFases' ? -10 : t === 'dCategorias' ? 12 : -14);
    const d = inactive ? `M${p[0]} ${p[1]} H${p[0] + 26} V${q[1] + 70} H${q[0]} V${q[1]}` : `M${p[0]} ${p[1]} V${my} H${q[0]} V${q[1]}`;
    rels += `<path class="rel${inactive ? ' inactive' : ''}" data-from="${f}" data-to="${t}" data-i="${i}" d="${d}"><title>${f}[${fc}] * → 1 ${t}[${tc}]${inactive ? ' (inativa)' : ''}</title></path>`;
    rels += `<text class="relmark" x="${p[0] + 4}" y="${p[1] + (ty < fy ? -6 : 14)}" fill="var(--accent)">*</text><circle cx="${q[0]}" cy="${q[1]}" r="3.6" fill="var(--steel)" data-from="${f}" data-to="${t}" class="reldot"/>`;
  });
  const boxes = Object.keys(MB).map(n => { const [x, y] = MB[n], role = TABLE_INFO[n].role, cls = role === 'fact' ? 'fact' : role === 'meas' ? 'meas' : 'dim';
    return `<g class="mt ${cls}" data-t="${n}" tabindex="0" role="button" aria-label="Tabela ${n}"><rect class="box" x="${x}" y="${y}" width="${BOXW}" height="${hgt(n)}" rx="9"/>

const CTX = () => `És o assistente do "Dossiê do Projeto Livre", um trabalho de formação em Power BI. Responde em português de Portugal, de forma clara e curta (máximo ~180 palavras, salvo se pedirem detalhe), sem inventar números: usa só os dados abaixo e o guia. Se a resposta não estiver nos dados, diz isso.

=== RESUMO DO TRABALHO ===
Tema 3 — Gestão de Projetos. Empresa fictícia Vértice Construções, 32 projetos (16 concluídos, 15 em curso, 1 suspenso), 2024–2025, data de corte 31/12/2025. Utilizador: Diretor de Projetos.
Dados: Excel fictício gerado com IA/script Python (semente 2025), com erros propositados (duplicados, nulos, espaços, maiúsculas, textos diferentes) tratados no Power Query.
Power Query: Append tCustos2024+tCustos2025; Merge de tClientes e tGestores em dProjetos (consultas auxiliares stg_ não carregadas); Trim, Text.Proper, Replace Values, Table.Distinct, filtro de nulos; colunas Dias_Atraso, Situacao_Prazo, Atrasada, Risco_Ordem; parâmetros CaminhoExcel e DataCorte.
Modelo em estrela: factos fOrcamento, fCustos, fTarefas, fProgresso; dimensões dProjetos, dFases, dCategorias, dCalendario (DAX, marcada como tabela de datas). Relações: ${M.rels.map(r => `${r[0]}[${r[1]}]→${r[2]}[${r[3]}]${r[4] === false ? ' (inativa)' : ''}`).join('; ')}. Todas *:1, direção única. dProjetos não liga ao Calendário (evita ambiguidade).
Medidas (${M.measures.length}): ${M.measures.map(m => `${m[1]} = ${m[2].replace(/\s+/g, ' ')}`).join(' | ')}

V_.assistente = () => `${H('', 'Assistente IA', 'Faça perguntas sobre o trabalho, o modelo, as medidas DAX ou as regras do guia. As respostas usam os dados deste dossiê e o texto integral do Guia_Projeto_Livre.pdf.')}
  <div class="card"><div class="chat" id="chat"><div class="msg bot">Olá! Posso explicar qualquer parte do trabalho ou ajudar a preparar a defesa. Escolha uma pergunta abaixo ou escreva a sua.</div></div>
    <div class="chips" style="margin:12px 0">${['Explica a medida Valor Ganho (EV) como se fosse para a defesa', 'Porque é que dProjetos não está ligada ao Calendário?', 'Que perguntas me pode fazer o formador na apresentação?', 'O que falta para cumprir a lista de verificação do Anexo C?', 'Qual a diferença entre Desvio vs Orçamento % e Desvio de Custo %?', 'Resume as 3 conclusões em 30 segundos'].map(q => `<button class="chip" data-ask="${esc(q)}">${q}</button>`).join('')}</div>
    <form class="composer" id="askForm"><textarea id="askBox" rows="2" placeholder="Escreva a sua pergunta…" aria-label="Pergunta ao assistente"></textarea><button class="btn primary" id="askBtn" type="submit">Perguntar</button><button class="btn" id="stopBtn" type="button" hidden>Parar</button></form>
    <p class="muted" id="aiNote" style="font-size:12.5px;margin:8px 0 0">As respostas são geradas com a sua conta Claude; na primeira pergunta é pedida autorização.</p></div>`;
async function ask(q){
  q = q.trim(); if (!q) return;
  const box = $('#chat'); if (!box) return;
  if (!sampleFn) { $('#aiNote').textContent = window.PL_STATIC ? 'Nesta versão pública o assistente não está disponível: precisa de uma conta Claude e funciona na versão do dossiê aberta em claude.ai.' : 'O assistente só funciona quando esta página é aberta em claude.ai.'; return }
  box.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(q)}</div>`);
  const bubble = document.createElement('div'); bubble.className = 'msg bot'; bubble.textContent = 'A pensar…'; box.append(bubble); bubble.scrollIntoView({block:'nearest'});
  chat.push({role:'user', content:q});
  const turns = [{role:'user', content:CTX()}, {role:'assistant', content:'Entendido. Vou responder com base nesses dados e no guia.'}, ...chat.slice(-8)];
  chatCtl = new AbortController(); $('#askBtn').disabled = true; $('#stopBtn').hidden = false;
  try { const {text} = await sampleFn(turns, {cache:false, signal:chatCtl.signal, onText:({text}) => { bubble.textContent = text }});
    chat.push({role:'assistant', content:text});
  } catch (e) { bubble.textContent = e.text || ''; chat.pop();
    const msg = {not_granted:'O assistente não foi autorizado nesta página.', sampling_disabled:'O Claude não está disponível nesta conta.', rate_limited:'Demasiados pedidos seguidos. Tente daqui a pouco.', session_expired:'A sessão expirou. Volte a iniciar sessão no claude.ai.', cancelled:''}[e.code] ?? 'Não foi possível obter resposta. Tente outra vez.';
    if (msg) bubble.insertAdjacentHTML('beforeend', `${e.text ? '\n\n' : ''}<span class="muted">${msg}</span>`);
    if (!e.text && !msg) bubble.remove();
  } finally { $('#askBtn').disabled = false; $('#stopBtn').hidden = true; }
}

// ---------- downloads ----------
let downloadsApi, filesLoaded = null;
function loadFiles(){ return filesLoaded ??= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'files_v8.js'; s.onload = () => res(window.PL_FILES); s.onerror = rej; document.head.append(s) }) }
async function download(key){
  const note = $('#dlnote');
  if (!downloadsApi && window.PL_STATIC) { const a = document.createElement('a'); a.href = window.PL_STATIC.files[key]; a.download = ''; document.body.append(a); a.click(); a.remove(); return }
  if (!downloadsApi) { if (note) note.textContent = 'A descarga só funciona quando esta página é aberta em claude.ai.'; return }
  try { const F = await loadFiles(); const f = F[key]; const bin = atob(f.b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    await downloadsApi.save({filename:f.name, data:new Blob([u])}); toast(`${f.name} guardado`);
  } catch (e) { if (e?.code === 'declined') return; toast(e?.code === 'rate_limited' ? 'Já há uma descarga a aguardar confirmação.' : e?.code === 'rejected_extension' ? 'Este tipo de ficheiro não pode ser descarregado aqui.' : 'Não foi possível descarregar o ficheiro.') }
}

// ---------- router ----------
function go(id, push = true){
  if (!V_[id]) id = 'inicio';
  const vw = $('#view'); vw.style.animation = 'none'; vw.innerHTML = V_[id](); void vw.offsetWidth; vw.style.animation = ''; $('#crumb').textContent = ALL[id][1]; requestAnimationFrame(runCounters);
  document.querySelectorAll('#nav [data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === id)));
  if (push) { try { history.replaceState(null, '', '#' + id) } catch {} }
  $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  window.scrollTo({top:0});
  if (id === 'modelo') modelPanel(null);
  if (id === 'medidas') renderMeasures();
  if (id === 'assistente') { if (!sampleFn) $('#aiNote').textContent = sampleFn === null ? 'O assistente só funciona quando esta página é aberta em claude.ai.' : $('#aiNote').textContent; chat.forEach(m => $('#chat').insertAdjacentHTML('beforeend', `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}">${esc(m.content)}</div>`)) }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-mv],[data-mf],[data-ask],[data-dl],[data-copy],[data-reset],[data-chkreset],[data-mclear],#menuBtn,#stopBtn,#msvg .mt');
  if (!t) { if ($('#side').classList.contains('open') && !e.target.closest('#side')) $('#side').classList.remove('open'); return }
  if (t.id === 'menuBtn') { const o = $('#side').classList.toggle('open'); t.setAttribute('aria-expanded', String(o)); return }
  if (t.id === 'stopBtn') { chatCtl?.abort(); return }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.mv) return modelView(t.dataset.mv);
  if (t.hasAttribute('data-mclear')) return modelView('all');
  if (t.classList?.contains('mt')) return modelSelect(t.dataset.t);
  if (t.dataset.mf) { document.querySelectorAll('[data-mf]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return renderMeasures() }
  if (t.dataset.ask) return ask(t.dataset.ask);
  if (t.dataset.dl) return download(t.dataset.dl);
  if (t.dataset.copy) { const k = t.dataset.copy, rows = k === 'a' ? ANEXO_A : ANEXO_B;
    const txt = (k === 'a' ? 'Anexo A — Proposta inicial\n\n' : 'Anexo B — Nota de utilização de IA\n\n') + rows.map(([l], i) => `• ${l}:\n${$('#' + k + i).value}`).join('\n\n');
    navigator.clipboard?.writeText(txt).then(() => toast('Texto copiado'), () => toast('Não foi possível copiar: selecione o texto manualmente.')); return }
  if (t.dataset.reset) { const k = t.dataset.reset, rows = k === 'a' ? ANEXO_A : ANEXO_B; rows.forEach(([, d], i) => { $('#' + k + i).value = d; store.set(k + i + ':v2', d) }); toast('Versão final reposta'); return }
  if (t.hasAttribute('data-chkreset')) { store.set('chk', []); go('anexo-c'); return }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('#msvg .mt')) { e.preventDefault(); modelSelect(e.target.dataset.t) } });
document.addEventListener('input', e => {
  if (e.target.id === 'mq') renderMeasures();
  if (e.target.dataset?.store) store.set(e.target.dataset.store + ':v2', e.target.value);
});
document.addEventListener('change', e => { if (e.target.dataset?.chk != null) { const st = store.get('chk', []); st[+e.target.dataset.chk] = e.target.checked; store.set('chk', st);
  const n = st.filter(Boolean).length; $('#chkn').textContent = `${n} de ${CHECK.length} confirmados`; $('#chkbar').style.width = n / CHECK.length * 100 + '%'; if (n === CHECK.length) toast('Lista completa!') } });
document.addEventListener('submit', e => { if (e.target.id === 'askForm') { e.preventDefault(); const b = $('#askBox'); const q = b.value; b.value = ''; ask(q) } });
document.addEventListener('keydown', e => { if (e.target.id === 'askBox' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#askForm').requestSubmit() } });

// ---------- efeitos visuais (fundo em rede, brilho do cursor, tiles, contadores, tema) ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function network(){
  const cv = $('#bg'), ctx = cv?.getContext('2d'); if (reduced || !ctx) return;
  let w, h, pts, mouse = {x:-999, y:-999}; const dpr = Math.min(devicePixelRatio || 1, 2);
  function size(){ w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    const n = Math.min(90, Math.round(innerWidth * innerHeight / 16000)); pts = Array.from({length:n}, () => ({x:Math.random() * w, y:Math.random() * h, vx:(Math.random() - .5) * .35 * dpr, vy:(Math.random() - .5) * .35 * dpr})) }
  size(); addEventListener('resize', size); addEventListener('pointermove', e => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr });
  const link = 140 * dpr;
  (function frame(){ ctx.clearRect(0, 0, w, h); const col = getComputedStyle(document.documentElement).getPropertyValue('--net').trim() || '54,226,196';
    for (const p of pts) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1; const dx = p.x - mouse.x, dy = p.y - mouse.y, dm = Math.hypot(dx, dy); if (dm < 120 * dpr && dm > 0) { p.x += dx / dm; p.y += dy / dm } }
    for (let i = 0; i < pts.length; i++) { for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < link) { ctx.strokeStyle = `rgba(${col},${(1 - d / link) * .35})`; ctx.lineWidth = dpr * .8; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke() } }
      ctx.fillStyle = `rgba(${col},.8)`; ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 1.6 * dpr, 0, 7); ctx.fill() }
    if (!document.hidden) requestAnimationFrame(frame); else setTimeout(() => requestAnimationFrame(frame), 500) })();
})();
const glow = $('.cursor-glow');
addEventListener('pointermove', e => { if (glow && !reduced) { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px' }
  const t = e.target.closest?.('.tile'); if (t) { const r = t.getBoundingClientRect(); t.style.setProperty('--mx', e.clientX - r.left + 'px'); t.style.setProperty('--my', e.clientY - r.top + 'px') } });
function runCounters(){
  if (reduced) return;
  document.querySelectorAll('#view .kpi .val').forEach(el => {
    const txt = el.textContent, m = txt.match(/^([+−-]?)(\d+(?:,\d+)?)(.*)$/); if (!m) return;
    const target = parseFloat(m[2].replace(',', '.')), dec = (m[2].split(',')[1] || '').length, t0 = performance.now();
    (function step(t){ const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
      el.textContent = m[1] + (target * e).toFixed(dec).replace('.', ',') + m[3]; if (k < 1) requestAnimationFrame(step); else el.textContent = txt })(t0);
  });
}
function setTheme(t){ try { document.documentElement.dataset.theme = t; localStorage.setItem('pl:theme', t) } catch {} }
(function(){ let saved = null; try { saved = localStorage.getItem('pl:theme') } catch {} if (saved) document.documentElement.dataset.theme = saved })();
document.addEventListener('click', e => { if (e.target.closest('#themeBtn')) { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); setTheme(cur === 'light' ? 'dark' : 'light') } });

renderNav();
go((location.hash || '').slice(1) || 'inicio', false);
if (window.claude?.use) {
  claude.use('sample').then(s => { sampleFn = s; if (!s && $('#aiNote')) $('#aiNote').textContent = 'O assistente só funciona quando esta página é aberta em claude.ai.' }).catch(() => { sampleFn = null });
  claude.use('downloads').then(d => { downloadsApi = d }).catch(() => {});
} else { sampleFn = null }
</script>
